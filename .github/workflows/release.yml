name: Build and Release AndroidCraft APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      release_name:
        description: 'Release Title'
        required: true
        default: 'AndroidCraft v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Restore Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare AndroidCraft-0.1.0 APK
        run: |
          mkdir -p release-artifacts
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/AndroidCraft-0.1.0.apk
            echo "Successfully prepared release-artifacts/AndroidCraft-0.1.0.apk"
          else
            echo "APK not found at app/build/outputs/apk/debug/app-debug.apk!"
            find app/build -name "*.apk"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidCraft-0.1.0
          path: release-artifacts/AndroidCraft-0.1.0.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name || 'v0.1.0' }}
          name: ${{ github.event.inputs.release_name || 'AndroidCraft v0.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/AndroidCraft-0.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
